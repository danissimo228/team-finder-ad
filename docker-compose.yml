services:
  db:
    image: postgres:16
    container_name: teamfinder_db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=team_finder
      - POSTGRES_USER=team_finder
      - POSTGRES_PASSWORD=team_finder
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team_finder -d team_finder"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: teamfinder_web
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=team_finder
      - POSTGRES_USER=team_finder
      - POSTGRES_PASSWORD=team_finder
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: always
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 3 &&
        python manage.py makemigrations --noinput &&
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "

volumes:
  postgres_data: